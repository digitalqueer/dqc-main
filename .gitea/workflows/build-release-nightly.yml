name: Build Deploy Preview

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  REGISTRY: https://gitea.dqc.dev
  IMAGE_NAME: ${{ gitea.repository_owner }}/${{ gitea.repository }}

jobs:

  build-deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract commit info
        id: vars
        run: |
          echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

      - name: Define image
        id: image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG=${{ steps.vars.outputs.SHA_SHORT }}

          echo "IMAGE=$IMAGE" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login \
            ${{ env.REGISTRY }} \
            -u "${{ secrets.REGISTRY_USERNAME }}" \
            --password-stdin

      - name: Build and Push
        id: build
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ${{ steps.image.outputs.IMAGE }}:${{ steps.image.outputs.TAG }} \
            --tag ${{ steps.image.outputs.IMAGE }}:nightly \
            --cache-from type=registry,ref=${{ steps.image.outputs.IMAGE }}:buildcache \
            --cache-to type=registry,ref=${{ steps.image.outputs.IMAGE }}:buildcache,mode=max \
            --push \
            .
