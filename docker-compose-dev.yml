services:
  dqc-psql:
    image: postgres:latest
    container_name: dqc-psql
    restart: always
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: digitalqueer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
